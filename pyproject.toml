[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-studio-activity-recorder"
version = "0.3.0"
description = "Local semantic activity timeline for FL Studio 26.1.3+"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "mido>=1.3,<2",
  "numpy>=1.26,<3",
  "pylsl>=1.17,<2",
  "python-multipart>=0.0.20,<1",
  "python-rtmidi>=1.5,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pyinstaller>=6.15,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
fl-activity-recorder = "fl_activity_recorder.main:main"
fl-activity-validate = "fl_activity_recorder.validation_report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_activity_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fl_activity_recorder"]
